name: control-evidence
on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 1 * *"   # monthly retest keeps evidence under the 90 day limit
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - run: pip install pytest
      - run: python scripts/run_evidence.py --out evidence
      - run: python scripts/run_recovery.py --out evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-evidence-py${{ matrix.python }}
          path: evidence/
